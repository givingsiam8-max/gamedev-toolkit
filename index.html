<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="GameDev Toolkit - one workspace for game development assets, images, textures, 3D models, colors, materials and developer utilities."
    />
    <title>GameDev Toolkit</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var raw = localStorage.getItem('gdt.settings');
        var theme = raw ? JSON.parse(raw).theme : null;
        if (theme === 'light' || theme === 'midnight' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
