    <link rel="icon" href="./favicon.ico" sizes="any" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GameDev Toolkit",
        "url": "https://givingsiam8-max.github.io/gamedev-toolkit/",
        "description": "A local-first workspace of 76 browser-based tools for game development: 3D models, textures, sprites, images, audio, animation, Unity utilities and developer data tools.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern browser such as Chrome, Edge, Firefox or Safari.",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!--
      Google Search Console verification:
      paste the meta tag from your Search Console property here and remove this comment.
      <meta name="google-site-verification" content="YOUR_VERIFICATION_TOKEN" />

      Analytics: no analytics or tracking scripts are enabled.
      If you add a provider such as GA4, update /privacy/ first and load the script only after render.
    -->

    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var raw = localStorage.getItem('gdt.settings');
        var theme = raw ? JSON.parse(raw).theme : null;
        if (theme === 'light' || theme === 'midnight' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
